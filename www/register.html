<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | BuddMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { orange: '#EA580C', dark: '#0F172A' } } } } }
  </script>
</head>
<body class="bg-[#FBFBFE] text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">
  
  <header class="max-w-5xl mx-auto w-full px-6 py-6 flex items-center justify-between">
    <a href="index.html" class="text-2xl font-bold tracking-tight text-slate-900">Budd<span class="text-brand-orange">Mate</span></a>
  </header>

  <main class="max-w-2xl mx-auto w-full px-6 py-8 flex-grow">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Create Your Account</h1>
    </div>

    <div class="bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-10 shadow-sm">
      <form id="registerForm" class="space-y-6">
        
        <!-- Account Setup (Email & Password) -->
        <div class="bg-orange-50/50 p-4 rounded-xl border border-orange-100 mb-6">
          <h3 class="text-sm font-semibold text-brand-orange mb-3">1. Account Setup (Login Details)</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="email" id="email_input" placeholder="Email Address" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white" required />
            <input type="password" id="password_input" placeholder="Create Password (Min 6 chars)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white" required minlength="6" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 uppercase tracking-wider mb-2">2. I am registering as</label>
          <div class="grid grid-cols-2 gap-3">
            <label id="label_child" class="border-2 border-brand-orange bg-orange-50/40 text-brand-orange font-medium text-sm rounded-xl py-3 text-center cursor-pointer transition">
              <input type="radio" name="registration_type" id="role_child" value="Child" checked class="sr-only" onchange="toggleRoles()">Child (For my Parent)
            </label>
            <label id="label_elder" class="border-2 border-slate-100 text-slate-600 font-medium text-sm rounded-xl py-3 text-center cursor-pointer transition">
              <input type="radio" name="registration_type" id="role_elder" value="Elder" class="sr-only" onchange="toggleRoles()">Elder (For Myself)
            </label>
          </div>
        </div>

        <div id="child_info" class="space-y-4 pt-4 border-t border-slate-100 transition-all duration-300">
          <h3 class="text-sm font-semibold text-slate-900">Your Contact Details (The Monitor)</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="text" id="child_name" placeholder="Your Full Name" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50/50" />
            <input type="tel" id="child_phone" placeholder="Your Phone Number" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50/50" />
          </div>
        </div>

        <div class="space-y-4 pt-4 border-t border-slate-100">
          <h3 id="relation_text" class="text-sm font-semibold text-slate-900">Parent Details</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="text" id="elder_name" placeholder="Elder Full Name" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50/50" required />
            <input type="tel" id="elder_phone" placeholder="Elder Phone Number" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50/50" required />
            <div class="sm:col-span-2">
              <input type="text" id="elder_address" placeholder="Complete Residential Address" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50/50" required />
            </div>
            <div class="sm:col-span-2">
              <input type="text" id="elder_id_number" placeholder="ID Number (Used for Trust Verification)" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50/50 font-mono tracking-widest" required />
            </div>
          </div>
        </div>
        
        <button type="submit" id="submitRegBtn" class="w-full py-4 rounded-full bg-slate-900 hover:bg-brand-orange text-white font-medium shadow-md transition-all">
          Complete Registration
        </button>
      </form>
    </div>
  </main>

  <script>
    function toggleRoles() {
      const isChild = document.getElementById('role_child').checked;
      document.getElementById('child_info').style.display = isChild ? 'block' : 'none';
      document.getElementById('relation_text').innerText = isChild ? "Parent Details (The elder you are caring for)" : "Your Details";
      document.getElementById('label_child').className = isChild ? "border-2 border-brand-orange bg-orange-50/40 text-brand-orange font-medium text-sm rounded-xl py-3 text-center cursor-pointer transition" : "border-2 border-slate-100 text-slate-600 font-medium text-sm rounded-xl py-3 text-center cursor-pointer transition";
      document.getElementById('label_elder').className = !isChild ? "border-2 border-brand-orange bg-orange-50/40 text-brand-orange font-medium text-sm rounded-xl py-3 text-center cursor-pointer transition" : "border-2 border-slate-100 text-slate-600 font-medium text-sm rounded-xl py-3 text-center cursor-pointer transition";
    }
  </script>

  <!-- FIREBASE AUTH & DATABASE INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfwhd5KfU-3NYelo_-Ys4IzxT8ZfXhoRI",
      authDomain: "buddmate.firebaseapp.com",
      projectId: "buddmate",
      storageBucket: "buddmate.firebasestorage.app",
      messagingSenderId: "329743289349",
      appId: "1:329743289349:web:0e060cd9a7ea9e5647a06c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitRegBtn');
      btn.innerHTML = "Creating Account... 🔄"; 
      btn.classList.add('opacity-75', 'cursor-not-allowed');

      const email = document.getElementById('email_input').value;
      const password = document.getElementById('password_input').value;

      try {
        // 1. Create User in Firebase Auth
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Save profile data to Firestore USING THEIR NEW UID
        await setDoc(doc(db, "users", user.uid), {
          email: email,
          role: document.querySelector('input[name="registration_type"]:checked').value,
          childName: document.getElementById('child_name').value,
          childPhone: document.getElementById('child_phone').value,
          elderName: document.getElementById('elder_name').value,
          elderPhone: document.getElementById('elder_phone').value,
          elderAddress: document.getElementById('elder_address').value,
          elderIdNumber: document.getElementById('elder_id_number').value,
          createdAt: serverTimestamp()
        });

        // 3. Redirect to Dashboard
        window.location.href = "dashboard.html";

      } catch (error) {
        console.error(error); 
        alert("Registration failed: " + error.message);
        btn.innerHTML = "Complete Registration"; 
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    });
  </script>
</body>
</html>
